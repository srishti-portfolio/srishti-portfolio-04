<svg xmlns="http://www.w3.org/2000/svg" width="56" height="46" viewBox="0 0 128 104">
  <!-- Cute witch on a flying broom (custom cursor). Hotspot = broom handle tip, top-left. -->

  <!-- sparkles trailing behind -->
  <path d="M110 30 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6z" fill="#F2C94C"/>
  <path d="M96 48 l1 2.8 2.8 1 -2.8 1 -1 2.8 -1 -2.8 -2.8 -1 2.8 -1z" fill="#F2C94C"/>

  <!-- cape flowing behind -->
  <path d="M54 40 Q72 41 86 56 Q75 53 67 62 Q62 50 54 40Z" fill="#5A232A"/>

  <!-- broom handle -->
  <line x1="6" y1="39" x2="92" y2="74" stroke="#8B5A3C" stroke-width="4.5" stroke-linecap="round"/>

  <!-- broom bristles -->
  <path d="M90 69 L122 57 Q128 78 121 99 L88 79Z" fill="#E8B84A" stroke="#B8862B" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M93 73 L121 65 M93 75 L124 78 M92 77 L120 91" stroke="#B8862B" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- binding -->
  <line x1="91.8" y1="68.6" x2="88.4" y2="77" stroke="#722F37" stroke-width="4.5" stroke-linecap="round"/>

  <!-- legs (dusty pink stockings) and boots -->
  <line x1="46" y1="58" x2="42" y2="71" stroke="#D7A7B1" stroke-width="4" stroke-linecap="round"/>
  <line x1="53" y1="60" x2="51" y2="72" stroke="#D7A7B1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="40" cy="72.5" rx="4.6" ry="2.6" fill="#3E1F24"/>
  <ellipse cx="49" cy="73.5" rx="4.6" ry="2.6" fill="#3E1F24"/>

  <!-- dress -->
  <path d="M46 39 L56 39 Q64 51 67 64 L39 58 Q41 47 46 39Z" fill="#722F37"/>
  <path d="M39 58 L67 64" stroke="#D7A7B1" stroke-width="2" stroke-linecap="round"/>

  <!-- arm holding the broom -->
  <path d="M48 43 Q42 47 36 51" stroke="#722F37" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="35" cy="51.2" r="2.8" fill="#FBE6D4"/>

  <!-- hair (behind head, blowing back) -->
  <path d="M41 28 Q37 40 44 44 L58 42 Q66 38 63 26Z" fill="#3E1F24"/>
  <path d="M58 27 Q73 28 77 42 Q68 37 60 39Z" fill="#3E1F24"/>

  <!-- head -->
  <circle cx="50" cy="31" r="10" fill="#FBE6D4"/>
  <!-- fringe -->
  <path d="M40 30 Q44 22 58 23 Q61 26 60 30 Q54 25.5 47 27 Q43 28 40 31Z" fill="#3E1F24"/>

  <!-- face -->
  <circle cx="45" cy="32" r="1.8" fill="#3E1F24"/>
  <circle cx="52" cy="32" r="1.8" fill="#3E1F24"/>
  <circle cx="45.6" cy="31.4" r="0.6" fill="#fff"/>
  <circle cx="52.6" cy="31.4" r="0.6" fill="#fff"/>
  <ellipse cx="42.6" cy="35.4" rx="2" ry="1.2" fill="#E8A3B0"/>
  <ellipse cx="54.6" cy="35.4" rx="2" ry="1.2" fill="#E8A3B0"/>
  <path d="M46.6 36.2 q2 2 4 0" stroke="#3E1F24" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- hat -->
  <path d="M42 22 Q47 9 56 3 Q64 0 72 6 Q64 6.5 61 12 Q59 17 60 22Z" fill="#722F37" stroke="#5A232A" stroke-width="1"/>
  <path d="M42.6 18.6 L60.2 18.6 L60.4 22 L42 22Z" fill="#D7A7B1"/>
  <path d="M51.5 8.5 l1.1 2.3 2.5 0.3 -1.8 1.7 0.5 2.5 -2.3 -1.2 -2.3 1.2 0.5 -2.5 -1.8 -1.7 2.5 -0.3z" fill="#F2C94C"/>
  <ellipse cx="51" cy="22.4" rx="15.5" ry="3.4" fill="#722F37" stroke="#5A232A" stroke-width="1"/>
</svg>
